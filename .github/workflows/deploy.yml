name: Desplegar SistemaCalificaciones en Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo de GitHub
        uses: actions/checkout@v4

      - name: Crear estructura de archivo WAR
        run: |
          cd SistemaCalificaciones
          zip -r ../app.war * .[^.]*

      - name: Desplegar WAR en Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'calificaciones-paginita'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: 'app.war'
